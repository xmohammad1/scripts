services:
  node:
    container_name: node
    privileged: true
    image: pasarguard/node:v0.5.3
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 1048576
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file: .env
    volumes:
      - /var/lib/pg-node:/var/lib/pg-node
